name: Deploy
on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# The API previously deployed to AWS ECS. AWS has been retired; the new API
# hosting target is not wired up yet, so this workflow only gates on CI.
# Add the deploy job(s) here once a host is chosen.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
