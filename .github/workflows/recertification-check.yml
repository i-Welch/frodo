name: Recertification Check
on:
  # Daily at 13:00 UTC (9:00 AM ET).
  schedule:
    - cron: '0 13 * * *'
  # Manual trigger for ad-hoc runs.
  workflow_dispatch:

concurrency:
  group: recertification-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Run recertification check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: noreply@reportraven.tech
          RECERT_ALERT_TO: isaac@reportraven.tech
        working-directory: dashboard
        run: bun scripts/recertification-check.ts
