# Local Postgres for development. Point DATABASE_URL at it:
#   postgres://postgres:postgres@localhost:5432/frodo
services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=frodo
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
